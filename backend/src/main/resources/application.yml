spring:
  application:
    name: dsa-platform
  profiles:
    # H2 by default so the backend starts with zero setup; use -Dspring-boot.run.profiles=postgres for the real DB.
    default: h2
  jpa:
    hibernate:
      # schema.sql is the source of truth; Hibernate only checks that entities match it.
      ddl-auto: validate
    # Controllers will return DTOs, so lazy loading outside a transaction should fail loudly, not silently query.
    open-in-view: false
    properties:
      hibernate:
        # All timestamps are stored as UTC so "days since last practice" never depends on the server's time zone.
        jdbc:
          time_zone: UTC
  sql:
    init:
      # Run schema.sql + data.sql on every start (both are idempotent), for H2 and Postgres alike.
      mode: always

server:
  port: 8081

app:
  cors:
    allowed-origin: http://localhost:5173
  unlock:
    # A topic unlocks when EVERY prerequisite meets both thresholds (CONTRACT.md section 2.3).
    # Kept here, not in the DB, so they can be tuned without a migration.
    min-retention: 0.6
    min-correct-count: 2
  readiness:
    # How many of the latest attempts in a topic count as "recent" for recent_accuracy.
    recent-attempts: 10
  hlr:
    # Produced by the offline Python training step; loaded once at startup in a later phase.
    weights-path: classpath:ml/hlr_weights.json

---
spring:
  config:
    activate:
      on-profile: h2
  datasource:
    # MODE=PostgreSQL + DATABASE_TO_LOWER so the same schema.sql/data.sql run unchanged on both databases.
    # DB_CLOSE_DELAY=-1 keeps the in-memory DB alive for the whole app lifetime.
    url: jdbc:h2:mem:dsa_platform;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password:
  h2:
    console:
      # Lets you inspect seeded rows at http://localhost:8080/h2-console during development/viva.
      enabled: true
      path: /h2-console

---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    # DB_PORT matches docker-compose.yml, so moving to 5433 is one environment variable.
    url: jdbc:postgresql://localhost:${DB_PORT:5432}/dsa_platform
    username: dsa
    password: dsa
